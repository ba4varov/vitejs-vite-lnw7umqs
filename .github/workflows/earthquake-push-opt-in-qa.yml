name: Earthquake Push opt-in safety QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/push.ts'
      - 'server/earthquake-push-consent.js'
      - 'server/earthquake-push-eligibility.js'
      - 'src/EarthquakePushOptIn.tsx'
      - 'src/earthquake-push-client.ts'
      - 'src/earthquake-push-opt-in.css'
      - 'src/PushSettings.tsx'
      - 'supabase/migrations/20261118093000_earthquake_push_opt_in.sql'
      - 'tests/unit/earthquake-push-consent.test.mjs'
      - 'tests/earthquake-push-opt-in.spec.ts'
      - 'tests/sql/earthquake-push-fixture.sql'
      - 'tests/sql/earthquake-push-consent.sql'
      - '.github/workflows/earthquake-push-opt-in-qa.yml'

permissions:
  contents: read

jobs:
  earthquake-push-consent:
    if: github.head_ref == 'feat/earthquake-push-opt-in-outbox'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: quake-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Consent, dedup, existing Push and Vercel budget unit tests
        run: node --test tests/unit/earthquake-push-consent.test.mjs tests/unit/earthquakes-core.test.mjs tests/unit/push.test.mjs tests/unit/vercel-endpoints.test.mjs
      - name: Isolated PostgreSQL ownership, consent and opt-out tests
        run: |
          set -euo pipefail
          for file in \
            tests/sql/earthquake-push-fixture.sql \
            supabase/migrations/20261118093000_earthquake_push_opt_in.sql \
            tests/sql/earthquake-push-consent.sql; do
            docker run --rm --network host \
              -e PGPASSWORD=quake-test-only \
              -v "${PWD}:/repo:ro" \
              postgres:17-alpine \
              psql -X -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f "/repo/${file}"
          done
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Opt-in and existing nearby earthquake browser checks
        run: npx playwright test tests/earthquake-push-opt-in.spec.ts tests/earthquakes-nearby.spec.ts --reporter=line --workers=2
      - name: Existing disabled-registration and Push profile regressions
        run: npx playwright test tests/push.spec.ts --grep "default registration off|push section visible without SQL migration" --reporter=line --workers=2 --output=work/earthquake-push-legacy-results
      - name: Browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-push-opt-in-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
