name: Weather vivid visual regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/weather-vivid.css'
      - 'tests/weather-vivid.spec.ts'
      - '.github/workflows/weather-vivid-qa.yml'

permissions:
  contents: read

jobs:
  visual-qa:
    if: github.head_ref == 'design/atmospheric-hero-header'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Visual and responsive regression (29 scenarios)
        run: npx playwright test tests/weather-vivid.spec.ts --reporter=line --workers=2
      - name: Save browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-vivid-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
