name: City photo galleries QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/city-photo-core.js'
      - 'src/CityPhotoLayer.tsx'
      - 'src/city-photo.css'
      - 'src/App.tsx'
      - 'tests/city-photo.spec.ts'
      - 'tests/unit/city-photo.test.mjs'
      - '.github/workflows/city-photo-qa.yml'

permissions:
  contents: read

jobs:
  city-photos:
    if: github.head_ref == 'feat/location-photo-gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test photo selection, cache and license filtering
        run: node --test tests/unit/city-photo.test.mjs
      - name: Production build (TypeScript included)
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: City photos browser regression
        run: npx playwright test tests/city-photo.spec.ts tests/weather-vivid.spec.ts --reporter=line --workers=2
      - name: Existing 390px forecast card regression
        run: npx playwright test tests/mobile-forecast-cards.spec.ts --grep "forecast cards 390 " --reporter=line --workers=2 --output=work/photo-card-regression
      - name: Save failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-photo-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
