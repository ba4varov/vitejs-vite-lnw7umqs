name: Nimbo visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/nimbo-vivid.css'
      - 'tests/nimbo-vivid.spec.ts'
      - '.github/workflows/nimbo-vivid-qa.yml'

permissions:
  contents: read

jobs:
  nimbo-design:
    if: github.head_ref == 'design/nimbo-visual-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Nimbo browser regression
        run: npx playwright test tests/nimbo-vivid.spec.ts --reporter=line --workers=2
      - name: Browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimbo-visual-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
