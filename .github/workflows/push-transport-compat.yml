name: Isolated Push HTTPS compatibility

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/push-transport-compat.yml'
      - 'tests/transport-compat/**'
      - 'scripts/test-push-transport-compat.mjs'
      - 'docs/push-transport-compat-bg.md'

permissions:
  contents: read

concurrency:
  group: push-transport-compat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  edge-https:
    name: Actual Edge v1.76.2 synthetic TLS experiment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          check-latest: false
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install checksum-verified Deno for dependency preparation only
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/transport-compat-tools"
          mkdir -p "$tools_dir"
          cd "$tools_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            'https://github.com/denoland/deno/releases/download/v2.5.6/deno-x86_64-unknown-linux-gnu.zip' \
            --output deno.zip
          echo 'fd4f6abc1b6a134fa9a4dba56519f1631f44c88e04e4e3e9a8ff5975dfa66e1a  deno.zip' | sha256sum --check --strict
          unzip -q deno.zip deno
          echo "$tools_dir" >> "$GITHUB_PATH"
      - name: Prepare frozen dependency cache without executing the experiment
        run: |
          set -euo pipefail
          deno --version
          docker --version
          DENO_DIR=work/transport-compat-cache deno cache --frozen \
            --config tests/transport-compat/deno.json \
            --lock supabase/functions/push-test/deno.lock tests/transport-compat/index.ts
      - name: Run actual digest-pinned Edge Runtime with external networking disabled
        run: node scripts/test-push-transport-compat.mjs
      - name: Confirm production and dependency files are untouched
        if: always()
        run: git diff --exit-code -- supabase api src server package.json package-lock.json
      - name: Upload safe compatibility evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: push-https-edge-v1.76.2-evidence
          path: work/transport-compat-report.json
          if-no-files-found: error
          retention-days: 14
