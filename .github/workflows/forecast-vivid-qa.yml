name: Forecast vivid responsive QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ForecastPeriodCard.tsx'
      - 'src/WeatherCharts.tsx'
      - 'src/forecast-vivid.css'
      - 'tests/forecast-vivid.spec.ts'
      - '.github/workflows/forecast-vivid-qa.yml'

permissions:
  contents: read

jobs:
  visual-qa:
    if: github.head_ref == 'design/forecast-cards-chart-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Weather tone and chart regression
        run: npx playwright test tests/forecast-vivid.spec.ts --reporter=line --workers=2
      - name: Existing forecast card geometry and interaction regression
        run: npx playwright test tests/mobile-forecast-cards.spec.ts --grep "forecast cards (360|390|768|1440) " --reporter=line --workers=2
      - name: Collect browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-vivid-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
