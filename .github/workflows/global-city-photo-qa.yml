name: Global geotagged city photos QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/city-photo-auto.js'
      - 'src/CityPhotoLayer.tsx'
      - 'src/App.tsx'
      - 'tests/unit/city-photo-auto.test.mjs'
      - 'tests/city-photo-auto.spec.ts'
      - 'tests/city-photo.spec.ts'
      - '.github/workflows/global-city-photo-qa.yml'

permissions:
  contents: read

jobs:
  global-city-photos:
    if: github.head_ref == 'feat/global-city-photo-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests for curated and automatic photo loading
        run: node --test tests/unit/city-photo.test.mjs tests/unit/city-photo-auto.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: City photo and atmospheric browser regressions
        run: npx playwright test tests/city-photo-auto.spec.ts tests/city-photo.spec.ts tests/weather-vivid.spec.ts --reporter=line --workers=2
      - name: Existing mobile forecast card regression
        run: npx playwright test tests/mobile-forecast-cards.spec.ts --grep "forecast cards 390 " --reporter=line --workers=2 --output=work/global-city-card-results
      - name: Browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-city-photo-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
