name: Earthquake nearby foundation QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/earthquakes-core.js'
      - 'api/alerts.ts'
      - 'src/NearbyEarthquakes.tsx'
      - 'src/nearby-earthquakes.css'
      - 'src/App.tsx'
      - 'docs/earthquake-alerts-architecture.md'
      - 'src/PushSettings.tsx'
      - 'tests/unit/earthquakes-core.test.mjs'
      - 'tests/earthquakes-nearby.spec.ts'
      - '.github/workflows/earthquakes-foundation-qa.yml'

permissions:
  contents: read

jobs:
  earthquake-foundation:
    if: github.head_ref == 'feat/earthquakes-nearby-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: API function budget and earthquake safety tests
        run: node --test tests/unit/vercel-endpoints.test.mjs tests/unit/earthquakes-core.test.mjs
      - name: Earthquake feed and safety unit tests
        run: node --test tests/unit/earthquakes-core.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Earthquake UI and current weather regressions
        run: npx playwright test tests/earthquakes-nearby.spec.ts tests/weather-vivid.spec.ts --reporter=line --workers=2
      - name: Existing 390px forecast card regression
        run: npx playwright test tests/mobile-forecast-cards.spec.ts --grep "forecast cards 390 " --reporter=line --workers=2 --output=work/earthquake-card-results
      - name: Browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earthquake-foundation-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
