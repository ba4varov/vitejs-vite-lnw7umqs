name: Balkan earthquake history QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/earthquakes-core.js'
      - 'server/earthquake-history-core.js'
      - 'api/alerts.ts'
      - 'src/EarthquakeHistory.tsx'
      - 'src/earthquake-history.css'
      - 'src/App.tsx'
      - 'tests/unit/earthquake-history.test.mjs'
      - 'tests/earthquake-history.spec.ts'
      - 'docs/earthquake-history-architecture.md'
      - '.github/workflows/earthquake-history-qa.yml'

permissions:
  contents: read

jobs:
  history:
    if: github.head_ref == 'feat/balkans-earthquake-history'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Catalog and prior live-alert API unit tests
        run: node --test tests/unit/earthquake-history.test.mjs tests/unit/earthquakes-core.test.mjs tests/unit/vercel-endpoints.test.mjs
      - name: TypeScript and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: History and nearby earthquake browser checks
        run: npx playwright test tests/earthquake-history.spec.ts tests/earthquakes-nearby.spec.ts --reporter=line --workers=2
      - name: Existing 390px mobile forecast regression
        run: npx playwright test tests/mobile-forecast-cards.spec.ts --grep "forecast cards 390 " --reporter=line --workers=2 --output=work/history-legacy-results
      - name: Browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balkans-earthquake-history-qa
          path: work/browser-results/
          retention-days: 3
          if-no-files-found: ignore
